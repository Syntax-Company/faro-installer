# Publica el sitio de get.faro.run: el instalador y el chart.
#
# ⚠️ QUÉ SIRVE CADA URL. El sitio de GitHub Pages de este repositorio publica cuatro cosas, y las
# cuatro salen de aquí:
#
#   https://get.faro.run                     install.sh   (la raíz DEVUELVE EL SCRIPT, ver abajo)
#   https://get.faro.run/install.sh          install.sh   (la misma URL, explícita)
#   https://get.faro.run/index.yaml          el índice del repositorio Helm
#   https://get.faro.run/faro-<version>.tgz  el chart empaquetado, una versión por release
#
# ⚠️ POR QUÉ LA RAÍZ ES `index.html` Y NO OTRA COSA. Pages sirve `index.html` como documento del
# directorio, así que para que `curl -fsSL https://get.faro.run | bash` funcione sin ruta, el script
# TIENE que publicarse con ese nombre. Se publica dos veces, byte a byte: como `index.html` (lo que
# devuelve la raíz) y como `install.sh` (la URL explícita, y la que se cita en los mensajes de
# error). Las dos copias las hace este workflow con un `cp`, así que no pueden divergir; editar
# cualquiera de las dos a mano en la rama del sitio se pierde en la siguiente publicación.
#
# El `Content-Type` de la raíz será `text/html`, lo cual es mentira pero da igual: `curl | bash` no
# lo mira. Un navegador que entre a get.faro.run verá el script en texto, que tampoco es mal
# resultado para una URL cuyo único propósito es ejecutarse.
#
# ⚠️ POR QUÉ PAGES Y NO UN PAQUETE OCI EN ghcr.io. Las dos cosas sirven charts, y la de OCI es más
# moderna. Se eligió Pages por tres razones concretas:
#
#   · Pages YA está en el camino crítico: la raíz tiene que servir el script sí o sí. Servir también
#     el chart desde ahí es un despliegue, un DNS y una cosa que puede romperse, en vez de dos.
#   · `helm` habla OCI solo desde la 3.8. Este instalador acepta cualquier Helm 3 (install.sh
#     comprueba `v3.*`), y subir ese mínimo por el transporte del chart es un requisito nuevo a
#     cambio de nada.
#   · La visibilidad de un paquete de ghcr.io se administra por paquete y hay que ponerla en público
#     a mano. Un chart que se publica privado por descuido pide credenciales al instalar — que es
#     justo la clase de fallo que se acaba de quitar de en medio.
#
# Un `.tgz` sobre HTTPS, además, se descarga con el `curl` que el instalador ya exige, sin que haga
# falta ni `helm registry login` ni `tar`.
#
# ── REQUISITO DE CONFIGURACIÓN (una vez, en el repositorio) ───────────────────────────────────
#
#   Settings → Pages → Source: "Deploy from a branch", rama `gh-pages`, carpeta `/ (root)`.
#   Settings → Pages → Custom domain: get.faro.run  (y el CNAME de DNS apuntando a Pages).
#
#   El fichero CNAME lo reescribe este workflow en cada publicación, porque un `git push` sobre la
#   rama del sitio que no lo lleve hace que Pages OLVIDE el dominio y get.faro.run deje de
#   responder — es decir, rompe el `curl | bash` sin tocar nada del script.
#
#   La rama `gh-pages` tiene que existir antes de la primera ejecución (el checkout de una rama que
#   no existe falla). Se crea vacía una sola vez:
#
#     git switch --orphan gh-pages
#     git commit --allow-empty -m "sitio de get.faro.run"
#     git push -u origin gh-pages
#     git switch master

name: publish

on:
  push:
    # Un tag `chart-v0.1.0` publica `faro-0.1.0.tgz` Y republica el script.
    tags:
      - 'chart-v*'
    # Un push a master republica SOLO el script, sin sacar versión del chart: son dos ciclos de vida
    # distintos, y encadenarlos obligaría a versionar el chart para corregir una errata del
    # instalador.
    #
    # ⚠️ El chart NO se publica por esta vía, y no es un descuido. Publicarlo en cada push
    # sobreescribiría un `.tgz` que instalaciones reales ya han descargado, y «faro-0.1.0» dejaría
    # de significar una cosa concreta.
    #
    # Sin filtro `paths`: aplicaría también a los pushes de tag y se saltaría la publicación de un
    # chart cuyo tag no tocara install.sh. El último paso ya no hace nada si el sitio no cambia,
    # que es la forma barata de conseguir lo mismo sin ese efecto de borde.
    branches:
      - master
  workflow_dispatch:

# Se escribe en la rama gh-pages.
permissions:
  contents: write

# ⚠️ Dos publicaciones a la vez sobre la misma rama pierden una: la segunda hace `push` sobre un
# índice que ya no es el que leyó. `cancel-in-progress: false` porque cancelar una publicación a
# medias es peor que hacer cola.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Código fuente
        uses: actions/checkout@v4
        with:
          path: src

      - name: Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # ⚠️ LA COMPROBACIÓN QUE IMPIDE LA DIVERGENCIA. Tres sitios dicen qué versión es el chart:
      # el tag de git, `Chart.yaml`, y la constante `CHART_VERSION_DEFAULT` del instalador — que es
      # la que un `curl | bash` va a descargar. Si los tres no coinciden, el instalador publicado
      # pide una versión que no existe (404 en mitad de la instalación) o, peor, una distinta de la
      # que se acaba de sacar, y nadie se entera hasta que un cliente lo ejecuta.
      #
      # Es el mismo patrón que el resto del repositorio: cuando dos sitios tienen que decir lo
      # mismo, algo lo comprueba en vez de confiar en que se acuerden.
      - name: Las tres versiones tienen que coincidir
        if: startsWith(github.ref, 'refs/tags/chart-v')
        working-directory: src
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#chart-v}"
          CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' charts/faro/Chart.yaml | head -n1 | tr -d '"')"
          SCRIPT_VERSION="$(sed -n 's/^CHART_VERSION_DEFAULT="\(.*\)"$/\1/p' install.sh)"

          echo "tag              chart-v$TAG_VERSION"
          echo "Chart.yaml       $CHART_VERSION"
          echo "install.sh       $SCRIPT_VERSION"

          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
            echo "::error::El tag dice $TAG_VERSION y charts/faro/Chart.yaml dice $CHART_VERSION."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SCRIPT_VERSION" ]; then
            echo "::error::El tag dice $TAG_VERSION y CHART_VERSION_DEFAULT de install.sh dice $SCRIPT_VERSION. Un curl|bash descargaria la version equivocada."
            exit 1
          fi

          # Y la otra pareja: la version de FARO. `appVersion` es el tag que piden los Deployments
          # cuando no se fija `images.*.tag`, asi que un chart publicado con un appVersion viejo
          # instala una version vieja sin decirlo. ci.yml ya lo comprueba en cada cambio; aqui otra
          # vez, porque un tag se puede sacar de un commit que nunca paso por ci.
          APP_VERSION="$(sed -n 's/^appVersion:[[:space:]]*//p' charts/faro/Chart.yaml | head -n1 | tr -d '"')"
          OFFERED="$(sed -n 's/^FARO_VERSION_DEFAULT="\(.*\)"$/\1/p' install.sh)"
          echo "appVersion       $APP_VERSION"
          echo "FARO_VERSION..   $OFFERED"
          if [ "$APP_VERSION" != "$OFFERED" ]; then
            echo "::error::Chart.yaml appVersion dice $APP_VERSION y FARO_VERSION_DEFAULT de install.sh dice $OFFERED."
            exit 1
          fi

      - name: El chart tiene que ser válido
        working-directory: src
        run: helm lint charts/faro --strict

      - name: Empaquetar el chart
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: helm package src/charts/faro --destination packaged

      # La rama del sitio se trae ENTERA porque el índice de un repositorio Helm es acumulativo: hay
      # que conservar los .tgz de todas las versiones anteriores. Una instalación que pinne
      # `--chart-version 0.1.0` dentro de un año tiene que seguir encontrando ese fichero.
      - name: Sitio publicado
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Añadir el paquete al sitio
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#chart-v}"
          if [ -f "site/faro-${VERSION}.tgz" ]; then
            echo "::error::faro-${VERSION}.tgz ya esta publicado. Una version publicada no se reescribe: instalaciones reales la han descargado y 'faro-${VERSION}' tiene que seguir significando lo mismo. Saca una version nueva."
            exit 1
          fi
          cp packaged/faro-*.tgz site/
          ls -l "site/faro-${VERSION}.tgz"

      - name: Publicar el instalador
        run: |
          set -euo pipefail
          # Las dos copias salen del mismo fichero, en el mismo paso: no hay ventana en la que
          # get.faro.run y get.faro.run/install.sh sirvan cosas distintas.
          cp src/install.sh site/install.sh
          cp src/install.sh site/index.html
          chmod 0644 site/install.sh site/index.html
          # Sin .nojekyll, Pages pasa el sitio por Jekyll, que se toma index.html como una plantilla
          # e ignora ficheros que empiecen por `_`. Un script de shell no sobrevive a eso.
          : > site/.nojekyll
          # ⚠️ Sin este fichero, el push a gh-pages borra el dominio personalizado en Settings y
          # get.faro.run deja de responder.
          printf 'get.faro.run\n' > site/CNAME
          # ⚠️ EL SITIO NO LLEVA .gitignore, Y ESTO NO ES LIMPIEZA.
          #
          # Es lo que rompió la publicación de 0.1.0. Si la rama del sitio se creó con
          # `git checkout --orphan` (que conserva el índice y el árbol de trabajo, al contrario que
          # `git switch --orphan`), el primer commit se llevó el .gitignore de master — y ahí hay un
          # `*.tgz` que existe para que los paquetes NO se commiteen en la rama de código. En la rama
          # del sitio esa misma regla significa lo contrario: que el paquete no se publica.
          #
          # `git add` no dice nada al saltarse un fichero ignorado, así que el trabajo terminó en
          # verde con el índice publicado y el .tgz no.
          #
          # El sitio es contenido 100% generado por este workflow: aquí no hay nada que ignorar
          # nunca, y por eso el fichero se borra en cada publicación en vez de editarse.
          rm -f site/.gitignore

      # ⚠️⚠️ EL ÍNDICE SE REGENERA ENTERO, A PARTIR DE LOS .tgz QUE HAY EN EL DIRECTORIO.
      #
      # Antes esto era `--merge`, que añade la entrada nueva al índice anterior. Es más barato y es
      # lo que rompió: `--merge` mantiene en el índice entradas cuyos ficheros ya no están —o nunca
      # llegaron a estar—, y entonces el índice pasa a ser una AFIRMACIÓN sobre el sitio en vez de
      # una DESCRIPCIÓN de él. Que 0.1.0 se anunciara con un 404 detrás es exactamente eso.
      #
      # Regenerando, el índice no puede hablar de un fichero que no existe: se construye leyendo los
      # ficheros. El precio es que los `created` se rescriben en cada publicación — ruido en un
      # fichero generado de una rama generada, que es el sitio más barato posible donde pagarlo.
      #
      # Efecto secundario deseado: una entrada fantasma que ya esté en el índice desaparece sola en
      # la siguiente publicación, sin cirugía manual.
      - name: Regenerar el índice desde los paquetes que hay
        working-directory: site
        run: |
          set -euo pipefail
          helm repo index . --url https://get.faro.run
          cat index.yaml

      - name: Registrar los ficheros del sitio
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # ⚠️ `-f` explícito para los paquetes. El `rm` del .gitignore de arriba ya debería bastar,
          # pero esto no depende de ello: es el fichero cuya ausencia silenciosa causó el fallo, y
          # forzarlo cuesta dos líneas.
          shopt -s nullglob
          paquetes=( *.tgz )
          if [ ${#paquetes[@]} -gt 0 ]; then
            git add -f -- "${paquetes[@]}"
          fi

      # ⚠️⚠️ LA GUARDA. Que el índice anuncie algo que no está no debería ser posible, y la
      # regeneración de arriba ya lo hace estructuralmente imposible... siempre que el fichero llegue
      # a publicarse. Este paso cierra el hueco que quedaba: comprueba, contra el ÍNDICE DE GIT y no
      # contra el disco, que cada URL anunciada corresponde a un fichero que se va a subir de verdad.
      #
      # Es la diferencia que importa: el fallo de 0.1.0 tenía el .tgz en el disco (por eso
      # `helm repo index` lo encontró y lo anunció) y fuera de git (por eso nunca se publicó). Mirar
      # el disco no lo habría detectado; mirar lo que git tiene registrado, sí.
      - name: El índice no puede anunciar lo que no se va a publicar
        working-directory: site
        run: |
          set -euo pipefail
          fallos=0
          anunciados="$(grep -oE 'https://get\.faro\.run/[^[:space:]]+\.tgz' index.yaml | sort -u || true)"
          if [ -z "$anunciados" ]; then
            echo "El indice no anuncia ningun paquete todavia."
            exit 0
          fi
          while read -r url; do
            fichero="${url##*/}"
            if [ ! -f "$fichero" ]; then
              echo "::error::El indice anuncia $url y $fichero no esta en el sitio."
              fallos=1
              continue
            fi
            if ! git ls-files --error-unmatch -- "$fichero" >/dev/null 2>&1; then
              echo "::error::El indice anuncia $url pero $fichero NO esta registrado en git: se publicaria un indice con un 404 detras. Mira si algo lo esta ignorando."
              fallos=1
              continue
            fi
            echo "ok  $url"
          done <<< "$anunciados"
          if [ "$fallos" -ne 0 ]; then
            echo "::error::No se publica nada: el indice y los paquetes no coinciden."
            exit 1
          fi

      - name: Subir el sitio
        working-directory: site
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "El sitio no ha cambiado; no se publica nada."
            exit 0
          fi
          git commit -m "publish: ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push origin gh-pages

      # Comprobación de lo que de verdad sirve el dominio. Todo lo anterior valida lo que se sube;
      # esto valida lo que se puede descargar, que es lo único que le consta a quien instala.
      #
      # Pages despliega de forma asíncrona, así que se reintenta: un 404 en el primer intento es
      # normal, uno a los dos minutos es el fallo que estamos arreglando.
      - name: El paquete se puede descargar
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#chart-v}"
          URL="https://get.faro.run/faro-${VERSION}.tgz"
          for intento in $(seq 1 12); do
            if curl -fsSL --max-time 20 -o /dev/null "$URL"; then
              echo "$URL responde (intento $intento)."
              exit 0
            fi
            echo "Todavia no ($intento/12); Pages despliega con retraso."
            sleep 15
          done
          echo "::error::$URL sigue sin responder dos minutos despues de publicar. El indice lo anuncia, asi que una instalacion que pinne $VERSION fallara con un 404."
          exit 1
