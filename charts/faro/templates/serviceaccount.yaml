{{- /*
Identidad in-cluster del backend de Faro.

Viene de `deploy/rbac/serviceaccount.yaml` del repo del backend, donde el namespace estaba CABLEADO
a `faro`. Aquí sale de `.Release.Namespace`: el chart se puede instalar en el namespace que el
cliente use sin editar ningún manifiesto.

⚠️ Crear la cuenta NO basta para que Faro la use. El cliente de Kubernetes no elige su identidad:
fabric8 lee el token que el kubelet proyecta en el pod, y quién es ese token lo decide el
`serviceAccountName` del Deployment. Sin ese campo, Kubernetes monta la cuenta `default` del
namespace —que no tiene ningún permiso— y Faro arranca SIN SÍNTOMAS: el fallo aparece en el primer
build, como un 403. Por eso el nombre es un helper compartido por los tres sitios que lo usan
(esta cuenta, el Deployment y el `subjects` del RoleBinding).

El token de esta cuenta solo sirve para hablar con el API server del cluster de CONTROL. Los
clusters de workload se manejan con el kubeconfig cifrado que Faro custodia en su base de datos.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "faro.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
