{{- /*
⚠️⚠️ EL SECRETO DE ARRANQUE — el objeto más delicado de esta instalación.

Lleva DOS cosas, y van juntas a propósito: son las dos que tienen que existir antes de que Faro
pueda hacer nada, y ninguna de las dos se puede pedir por la interfaz porque la interfaz todavía no
es alcanzable.

  FARO_CREDENTIAL_KEY   la llave maestra. Cifra (AES-256) todo lo que Faro custodia: los tokens de
                        acceso a repositorios, los kubeconfig de los clusters registrados, las
                        credenciales del proveedor de identidad que capture el asistente y los
                        secretos de las aplicaciones desplegadas.

                        · Si se PIERDE, ese material es IRRECUPERABLE. La base de datos sigue viva
                          y completamente ilegible: no hay copia, no hay rescate.
                        · Si se CAMBIA, lo ya cifrado deja de poder leerse (mismo efecto).

  FARO_BOOTSTRAP_TOKEN  el acceso inicial. Rompe el círculo "hace falta el proveedor de identidad
                        para entrar, y entrar para configurarlo": se canja en
                        POST /platform/onboarding/session por una sesión LIMITADA a los endpoints
                        del asistente. No es un usuario con contraseña —eso sería un camino de
                        autenticación permanente—: está hecho para morirse, y el backend lo mata
                        por tres vías (un login real por el IdP lo cierra, se comprueba en cada
                        petición, y caduca a las 24h del primer arranque de la instalación).

⚠️ `helm.sh/resource-policy: keep`. Helm NO borra este Secret al desinstalar. Un `helm uninstall`
que se llevara la llave dejaría la base de datos intacta y sin manera de descifrarla — el peor
resultado posible de un comando que la gente ejecuta pensando que "ya reinstalo".

  El precio del `keep`: al reinstalar, el Secret sigue ahí con los metadatos de propiedad de la
  release anterior. Con el MISMO nombre de release y namespace, Helm lo adopta. Con otro nombre,
  aborta con "invalid ownership metadata" y hay que borrarlo a mano — para lo cual hace falta tener
  la llave guardada FUERA del cluster igualmente.

⚠️ Por qué los valores se resuelven con `lookup` (ver el helper): para que un `helm upgrade` que no
vuelva a pasarlos NO los rote. Sin eso, actualizar sin acordarse de la llave maestra la regeneraría
en silencio y la instalación quedaría ilegible. Es también lo que permite que el fichero de valores
que el instalador deja en disco no contenga ningún secreto.

⚠️ Y las DOS claves no se resuelven igual, aunque vivan en el mismo Secret — es la consecuencia
directa del `keep` de arriba:

  la llave    se recupera SIEMPRE que esté. Da igual que la release ya no exista: el volumen de la
              base de datos también sobrevive al uninstall, así que puede haber datos cifrados con
              ella esperando.
  el token    se recupera SOLO en un upgrade. En un install se genera otro y se sobrescribe el que
              hubiera. Heredar el acceso inicial de una instalación anterior es dar por bueno un
              token que ya circuló para abrir el asistente de una instalación nueva.

En producción, `credentialKey.existingSecret` es mejor todavía: el Secret lo crea el operador desde
su gestor de secretos, Helm nunca lo posee y la llave no pasa por ningún values ni por el historial
de releases.

    kubectl create secret generic faro-bootstrap -n faro \
      --from-literal=FARO_CREDENTIAL_KEY="$(openssl rand -base64 32)" \
      --from-literal=FARO_BOOTSTRAP_TOKEN="$(openssl rand -hex 20)"
*/ -}}
{{- if not .Values.credentialKey.existingSecret }}
{{- /* Del helper, no de un printf repetido: este nombre lo usan también el Deployment del backend y
       el `lookup` de aquí abajo, y si los tres no coinciden el lookup no encuentra nada y la llave
       se regenera en cada upgrade. */ -}}
{{- $name := include "faro.bootstrapSecretName" . }}
{{- /* ⚠️⚠️ LA COMPROBACIÓN DE FORMA, y es lo primero que pasa aquí a propósito.

       Los dos valores de este Secret son cadenas opacas que se imprimen seguidas en la misma
       pantalla al terminar de instalar. Copiar la equivocada no da ningún error: el token se escribe
       en el Secret, el backend lo acepta como token, y el operador descubre que «no le vale» cuando
       intenta entrar al asistente con la llave maestra.

       Por eso cada uno tiene una forma distinta y RECONOCIBLE (ver faro.newBootstrapToken en el
       helper), y aquí se comprueban las dos. Confundirlas aborta la instalación diciendo cuál es
       cuál, en vez de dejar el valor equivocado en el cluster. Es también lo que caza que el
       instalador y el chart vuelvan a divergir en la forma que generan. */ -}}
{{- if and .Values.bootstrapToken.value (not (regexMatch "^[0-9a-f]{40}$" .Values.bootstrapToken.value)) }}
{{- fail (printf "bootstrapToken.value no tiene la forma del token de acceso inicial: se esperan 40 caracteres hexadecimales en minuscula y han llegado %d caracteres. ⚠️ Si el valor acaba en '=' es la LLAVE MAESTRA (credentialKey.value), que es base64 de 32 bytes y son 44 caracteres: viven en el MISMO Secret y no son intercambiables. El token abre el asistente de primer arranque; la llave cifra lo que Faro guarda y perderla es irreversible. Genera un token con: openssl rand -hex 20" (len .Values.bootstrapToken.value)) }}
{{- end }}
{{- if and .Values.credentialKey.value (not (regexMatch "^[A-Za-z0-9+/]{43}=$" .Values.credentialKey.value)) }}
{{- fail (printf "credentialKey.value no tiene la forma de la llave maestra: se esperan 44 caracteres en base64 acabados en '=' (32 bytes exactos, que es lo que el backend exige) y han llegado %d caracteres. ⚠️ Si son 40 caracteres hexadecimales es el TOKEN de acceso inicial (bootstrapToken.value): viven en el MISMO Secret y no son intercambiables. Genera una llave con: openssl rand -base64 32" (len .Values.credentialKey.value)) }}
{{- end }}
{{- /* `reuse` SIEMPRE: la llave se conserva aunque la release ya no exista. El Secret sobrevive al
       uninstall y el volumen de la base también, así que puede haber datos cifrados con ella. */ -}}
{{- $key := include "faro.secretValue" (dict
      "ctx" $
      "secret" $name
      "key" "FARO_CREDENTIAL_KEY"
      "value" .Values.credentialKey.value
      "reuse" true
      "generateAs" ""
      "keepEmpty" false
      "message" "credentialKey.value es OBLIGATORIO en una instalacion nueva (o usa credentialKey.existingSecret). Es la llave maestra que cifra TODAS las credenciales que Faro guarda: si se pierde, ese material es irrecuperable. Genera una con: openssl rand -base64 32 (exactamente 32 bytes en base64) y guardala FUERA del cluster antes de instalar. Si esto sale en un helm upgrade de una instalacion que YA existe, es que el chart no pudo leer el Secret actual: helm template y --dry-run no consultan el cluster. Vuelve a pasar el valor, o usa credentialKey.existingSecret.") }}
{{- $token := "" }}
{{- if not .Values.bootstrapToken.disabled }}
{{- /* ⚠️ `reuse` SOLO al actualizar, y aquí está la diferencia con la llave.

       En un `helm upgrade` se conserva el que ya está: rotarlo en cada actualización dejaría
       inservible el que el operador apuntó, que era el fallo que se arregló al escribir el chart.

       En un `helm install` se genera uno NUEVO y se sobrescribe el que hubiera. Sin esto, el
       `resource-policy: keep` de este Secret —que existe para que un uninstall no se lleve la
       llave— hacía que una instalación nueva sobre los restos de otra heredase su token de acceso
       inicial: un acceso que ya circuló, que alguien pudo apuntar, y que abre el asistente de la
       instalación nueva.

       `keepEmpty`: si al actualizar la clave está pero vacía, es que el acceso se retiró a
       propósito. Se deja vacía en vez de generar otro, que reabriría la puerta. */ -}}
{{- $token = include "faro.secretValue" (dict
      "ctx" $
      "secret" $name
      "key" "FARO_BOOTSTRAP_TOKEN"
      "value" .Values.bootstrapToken.value
      "reuse" $.Release.IsUpgrade
      "generateAs" "token"
      "keepEmpty" true
      "message" "") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  FARO_CREDENTIAL_KEY: {{ $key | quote }}
  # Vacío = acceso inicial DESHABILITADO, que es lo que el backend entiende por "sin token".
  #
  # ⚠️ Retíralo en cuanto el asistente termine: es la higiene recomendada, y el backend deja un WARN
  # en el arranque si sigue puesto con la puerta ya cerrada. `--set bootstrapToken.value=""` NO
  # basta —el lookup lo recuperaría del Secret—; la forma de retirarlo es:
  #
  #     helm upgrade ... --set bootstrapToken.disabled=true
  #
  # No es urgente: el propio backend lo cierra solo cuando un login real por el proveedor de
  # identidad funciona, y caduca a las 24h del primer arranque de la instalación aunque nadie
  # complete el asistente.
  FARO_BOOTSTRAP_TOKEN: {{ $token | quote }}
{{- end }}
