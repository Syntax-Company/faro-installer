{{- /*
Secreto de descarga de las imágenes (imagePullSecret).

⚠️ Los paquetes `ghcr.io/syntax-company/faro-backend` y `faro-frontend` son PRIVADOS. Sin este
Secret referenciado en los DOS Deployments, los pods se quedan en ImagePullBackOff con un
`denied: denied` del registry — que se lee como "el tag no existe" o "el repositorio está mal
escrito", no como "faltan credenciales". Es un rato perdido garantizado.

Credenciales para ghcr.io: usuario de GitHub (o el bot de la organización) y un PAT clásico con el
scope `read:packages`. Un token de organización con acceso de lectura a los paquetes es lo correcto
para una instalación de cliente; un PAT personal ata la instalación a una persona.

Alternativa sin poner el PAT en el values: crearlo fuera y usar `imagePullSecret.mode=existing`.

    kubectl create secret docker-registry faro-ghcr \
      --namespace faro \
      --docker-server=ghcr.io \
      --docker-username=<usuario> \
      --docker-password=<PAT con read:packages>
*/ -}}
{{- if eq .Values.imagePullSecret.mode "create" }}
{{- $name := include "faro.imagePullSecretName" . }}
{{- /*
⚠️ Igual que la llave maestra y la contraseña de la base: si no se pasan las credenciales, se
reutiliza el dockerconfigjson que YA está en el cluster.

Sin esto, el `helm upgrade -f faro-values.yaml` que documenta el README —y que imprime el propio
instalador— fallaría: ese fichero lleva `mode: create` pero NO las credenciales, que viven solo en
el values temporal de la instalación. Exigirlas en cada actualización obligaría a tener el PAT a
mano para cambiar cualquier otra cosa, que es justo lo que se quería evitar.

Se reutiliza el blob entero y no usuario/contraseña por separado, porque es lo que el Secret guarda:
extraerlos del JSON aquí sería reconstruir lo que ya está hecho.
*/ -}}
{{- $cfg := "" }}
{{- if or .Values.imagePullSecret.username .Values.imagePullSecret.password }}
{{- $registry := required "imagePullSecret.registry es OBLIGATORIO con mode=create (ej. ghcr.io)." .Values.imagePullSecret.registry }}
{{- $username := required "imagePullSecret.username es OBLIGATORIO con mode=create." .Values.imagePullSecret.username }}
{{- $password := required "imagePullSecret.password es OBLIGATORIO con mode=create: un PAT con el scope read:packages." .Values.imagePullSecret.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
{{- $cfg = dict "auths" (dict $registry (dict "username" $username "password" $password "auth" $auth)) | toJson | b64enc }}
{{- else }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- if and $existing $existing.data }}
{{- $cfg = (index $existing.data ".dockerconfigjson" | default "") }}
{{- end }}
{{- end }}
{{- if not $cfg }}
{{- fail "imagePullSecret.mode=create sin credenciales, y no hay ningun Secret de descarga previo del que reutilizarlas. Pasa imagePullSecret.username y imagePullSecret.password (un PAT con el scope read:packages), o usa mode=existing con un Secret que hayas creado tu. Si esto sale en un `helm template` o un `--dry-run` sobre una instalacion que YA existe, es que esos modos no consultan el cluster: es esperable y no indica un problema real." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg }}
{{- end }}
