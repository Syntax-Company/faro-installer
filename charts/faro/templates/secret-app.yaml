{{- /*
La contraseña de la base de datos.

Antes este Secret llevaba tres cosas; ahora solo una. El client secret del proveedor de identidad y
el token del repositorio de GitOps ya NO se configuran aquí: los captura el asistente de primer
arranque y viven cifrados en la base de datos, en la tabla `credential`. Ponerlos en el chart no
tendría ningún efecto — el backend retiró esas variables de entorno.

Va separado del secreto de arranque a propósito: la contraseña de la base se puede volver a pedir a
quien administra el Postgres; la llave maestra no se puede volver a conseguir de ningún sitio, y por
eso aquella lleva `resource-policy: keep` y ésta no.

La clave se llama EXACTAMENTE como la variable de entorno, para poder montarla con `envFrom` sin una
tabla de traducción intermedia. Si usas `secrets.existingSecret`, tu Secret tiene que usar ese mismo
nombre: DB_PASSWORD.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- /* Del helper: el mismo nombre que monta el Deployment con envFrom y que consulta el lookup. */ -}}
{{- $name := include "faro.appSecretName" . }}
{{- $password := include "faro.secretValue" (dict
      "ctx" $
      "secret" $name
      "key" "DB_PASSWORD"
      "value" .Values.database.password
      "reuse" true
      "generateAs" ""
      "message" "database.password es OBLIGATORIO en una instalacion nueva. El backend no tiene default para DB_PASSWORD: el que tenia ('1234', el del Postgres de desarrollo) viajaba horneado en la imagen, asi que una instalacion que la olvidara arrancaba intentando entrar con esa contrasena y, si el Postgres del cliente la aceptaba, nadie se enteraba nunca.") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  DB_PASSWORD: {{ $password | quote }}
{{- end }}
